name: Go Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  datasentinel-scan:
    name: Security Scan using DataSentinel
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Tool
      run: go build -o datasentinel .

    - name: Run DataSentinel Scan
      run: ./datasentinel --headless --scan . --output report.json

    - name: Upload Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: datasentinel-report
        path: report.json
